<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Quiz Champions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040820; --deep:#0a1250; --mid:#14217e; --line:#3a4fc0;
    --gold:#ffc83d; --gold2:#ff9d1c; --text:#f3f6ff; --muted:#9db0ee;
    --ok:#22d37a; --bad:#ff4d63;
    --hex:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden}

  /* ---------- STUDIO BACKGROUND ---------- */
  .studio{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
    radial-gradient(70% 55% at 50% 0%,#27409f 0%,rgba(20,33,126,.5) 38%,transparent 70%),
    linear-gradient(180deg,#050a2e 0%,#030618 100%)}
  .beams{position:absolute;inset:-20% -10% 20% -10%;background:
    conic-gradient(from 180deg at 50% -8%,
      transparent 0 6%, rgba(92,140,255,.20) 8% 11%, transparent 13% 19%,
      rgba(255,200,61,.13) 21% 24%, transparent 26% 40%,
      transparent 60% 74%, rgba(255,200,61,.13) 76% 79%, transparent 81% 87%,
      rgba(92,140,255,.20) 89% 92%, transparent 94%);
    filter:blur(6px);animation:sweep 14s ease-in-out infinite alternate;transform-origin:50% 0}
  @keyframes sweep{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  .floor{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:
      linear-gradient(180deg,transparent,rgba(30,60,200,.28)),
      repeating-linear-gradient(90deg,rgba(120,150,255,.10) 0 1px,transparent 1px 90px);
    transform:perspective(500px) rotateX(58deg);transform-origin:50% 100%;opacity:.7}
  .stars{position:absolute;inset:0;background-image:
    radial-gradient(1.5px 1.5px at 12% 22%,#fff8,transparent),
    radial-gradient(1.5px 1.5px at 78% 14%,#fff8,transparent),
    radial-gradient(1px 1px at 40% 40%,#fff6,transparent),
    radial-gradient(1px 1px at 90% 55%,#fff6,transparent),
    radial-gradient(1.5px 1.5px at 25% 70%,#fff5,transparent);
    animation:tw 5s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.4}to{opacity:1}}

  /* ---------- HEADER ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px}
  .logo{font-family:Oswald,Impact,sans-serif;font-weight:700;letter-spacing:3px;font-size:26px;line-height:1;text-transform:uppercase}
  .logo b{display:block;font-size:12px;letter-spacing:7px;color:var(--gold);font-weight:600;margin-top:3px}
  .logo span{background:linear-gradient(180deg,#fff,#ffd978 60%,#ff9d1c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(255,200,61,.35)}
  .hdr-r{display:flex;align-items:center;gap:10px}
  .badge{font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(10,18,80,.8);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:8px}
  .badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#7a86c9}
  .badge.live{color:#bdf5d6;border-color:#1c8f5a}
  .badge.live::before{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .hostbtn{font:600 12px Inter;letter-spacing:1px;text-transform:uppercase;color:var(--gold);background:transparent;border:1px solid rgba(255,200,61,.5);border-radius:8px;padding:8px 12px;cursor:pointer}
  .hostbtn:hover{background:rgba(255,200,61,.12)}

  /* ---------- LAYOUT ---------- */
  main{max-width:1120px;margin:0 auto;padding:6px 20px 10px;display:grid;grid-template-columns:1fr 290px;gap:22px;align-items:start}
  @media(max-width:880px){main{grid-template-columns:1fr}}
  .hidden{display:none!important}
  .panel{background:linear-gradient(180deg,rgba(22,36,118,.88),rgba(8,14,58,.92));border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);padding:24px;backdrop-filter:blur(4px)}
  h2{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin:0 0 16px;font-size:22px}
  h3{font-family:Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;font-weight:500;font-size:13px;color:var(--gold);margin:0 0 10px}
  label{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
  input[type=text]{width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--line);background:rgba(3,6,30,.8);color:var(--text);font:500 16px Inter}
  input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.2)}
  button{font-family:inherit}
  .btn{cursor:pointer;border:0;border-radius:10px;padding:14px 26px;font:700 16px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#2a1700;background:linear-gradient(180deg,#ffe08a,#ffb62e 55%,#ff9d1c);box-shadow:0 6px 0 #a45a00,0 12px 24px rgba(255,157,28,.35);transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #a45a00}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
  .btn.sm{padding:10px 16px;font-size:13px;box-shadow:0 4px 0 #a45a00}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;font-size:13px;padding:10px 16px}
  .btn.red{background:linear-gradient(180deg,#ff8a97,#ff4d63);color:#fff;box-shadow:0 4px 0 #8f1626}
  .err{color:#ff8b99;font-size:14px;min-height:20px;margin-top:12px}

  /* teams picker */
  .teams{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .team{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(3,6,30,.7);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:600}
  .team .dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}
  .team small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  .team.sel{border-color:var(--gold);background:rgba(255,200,61,.1);box-shadow:0 0 0 3px rgba(255,200,61,.15)}

  /* ---------- HEXAGON GAME-SHOW BARS ---------- */
  .hexb{--p:polygon(var(--hex) 0,calc(100% - var(--hex)) 0,100% 50%,calc(100% - var(--hex)) 100%,var(--hex) 100%,0 50%);
    position:relative;display:block;width:100%;padding:2px;border:0;background:linear-gradient(180deg,#ffe9a8,#c7871a);clip-path:var(--p);color:var(--text);text-align:left}
  .hexb .in{display:flex;align-items:center;gap:14px;clip-path:var(--p);background:linear-gradient(180deg,#1c2fa0 0%,#0a1260 55%,#070d44 100%);padding:15px 30px;min-height:56px;font-size:18px;font-weight:600}
  .qban{margin-bottom:18px}
  .qban .in{justify-content:center;text-align:center;min-height:104px;padding:20px 52px;font:600 24px/1.3 Oswald,Inter,sans-serif;letter-spacing:.5px;background:linear-gradient(180deg,#2338b8 0%,#0c1668 60%,#080f4a 100%)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.opts{grid-template-columns:1fr}.qban .in{font-size:20px;padding:18px 40px}}
  .opt{cursor:pointer;transition:filter .15s,transform .1s}
  .opt:hover:not(:disabled) .in{background:linear-gradient(180deg,#3a52e0,#1a2aa0)}
  .opt:disabled{cursor:default}
  .opt b{flex:none;width:30px;height:30px;display:grid;place-items:center;background:linear-gradient(180deg,#ffe08a,#ff9d1c);color:#2a1700;font:700 15px Oswald;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding-top:1px}
  .opt.sel{background:linear-gradient(180deg,#ffe9a8,#ff9d1c)}
  .opt.sel .in{background:linear-gradient(180deg,#ff9d1c,#b45f00);color:#fff}
  .opt.ok{background:linear-gradient(180deg,#9bffc9,#12a35a)}
  .opt.ok .in{background:linear-gradient(180deg,#19c26e,#0a6b3b);animation:flash .5s 3}
  .opt.bad{background:linear-gradient(180deg,#ffb0ba,#c1223a)}
  .opt.bad .in{background:linear-gradient(180deg,#e8374f,#7e1020)}
  .opt.dim{filter:saturate(.3) brightness(.65)}
  @keyframes flash{50%{filter:brightness(1.5)}}
  .cnt{margin-left:auto;font:700 14px Orbitron;color:var(--gold)}

  .qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
  .pill{font:600 14px Oswald;letter-spacing:2px;text-transform:uppercase;background:rgba(3,6,30,.7);border:1px solid var(--line);border-radius:999px;padding:7px 16px;color:var(--muted)}
  .pill b{color:var(--gold)}
  .timer{position:relative;width:68px;height:68px}
  .timer svg{width:100%;height:100%;transform:rotate(-90deg)}
  .timer circle{fill:rgba(3,6,30,.75);stroke-width:6}
  .timer .trk{stroke:#1d2a85}
  .timer .rng{fill:none;stroke:var(--gold);stroke-linecap:round;filter:drop-shadow(0 0 5px var(--gold))}
  .timer.low .rng{stroke:var(--bad);filter:drop-shadow(0 0 6px var(--bad))}
  .timer span{position:absolute;inset:0;display:grid;place-items:center;font:800 20px Orbitron}
  .led{font:800 20px Orbitron;color:#ffb627;text-shadow:0 0 12px rgba(255,182,39,.7);background:#120a00;border:1px solid #5a3a00;border-radius:8px;padding:6px 12px;min-width:88px;text-align:right;letter-spacing:1px}
  .fb{min-height:34px;margin-top:16px;text-align:center;font:600 20px Oswald;letter-spacing:1.5px;text-transform:uppercase}

  .center{text-align:center}
  .onair{display:inline-flex;align-items:center;gap:8px;font:600 13px Oswald;letter-spacing:3px;color:#fff;background:#c4122d;border-radius:6px;padding:5px 12px;margin-bottom:14px}
  .onair::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}
  .bigled{font:800 52px Orbitron;color:#ffb627;text-shadow:0 0 22px rgba(255,182,39,.8);margin:10px 0}
  .dots{display:flex;justify-content:center;gap:10px;margin-top:20px}
  .dots i{width:12px;height:12px;border-radius:50%;background:var(--gold);animation:bounce 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
  .muted{color:var(--muted)}

  /* ---------- SCOREBOARD ---------- */
  .lb{list-style:none;margin:0;padding:0}
  .lb li{display:flex;align-items:center;gap:10px;padding:10px 10px;border-bottom:1px solid rgba(58,79,192,.35)}
  .lb li.me{background:rgba(255,200,61,.1);border-radius:8px}
  .lb .rk{width:22px;font:700 15px Oswald;color:var(--gold)}
  .lb .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .lb .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .lb .pt{font:700 14px Orbitron;color:#ffb627}
  .empty{color:var(--muted);font-size:14px;padding:6px 4px}

  /* ---------- TEAM PODIUMS ---------- */
  .podiums{display:flex;gap:16px;justify-content:center;align-items:flex-end;padding:18px 20px 34px;overflow-x:auto;max-width:1120px;margin:0 auto}
  .podw{flex:1;min-width:150px;max-width:230px;filter:drop-shadow(0 -6px 18px var(--tc))}
  .pod{position:relative;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);background:linear-gradient(180deg,#223596 0%,#0b1352 100%);padding:16px 12px 14px;text-align:center}
  .pod::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--tc);box-shadow:0 0 20px var(--tc)}
  .pod .rank{font:700 12px Oswald;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .pod .pn{font:600 18px Oswald;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 8px}
  .pod .led{display:inline-block;text-align:center;font-size:22px}
  .pod .mem{font-size:11px;color:var(--muted);margin-top:7px;letter-spacing:1px}
  .podw.first .pod{background:linear-gradient(180deg,#34479f,#101a66)}
  .podw.first .rank{color:var(--gold)}

  /* ---------- HOST ---------- */
  .hostgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:16px 0}
  .hstat{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .hstat .led{font-size:16px}
  .bar{height:6px;background:rgba(3,6,30,.8);border-radius:99px;overflow:hidden;margin-top:6px;width:100%}
  .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
  .hmsg{color:#ff8b99;font-size:14px;min-height:20px;margin-top:10px}
</style>
<style>
  /* extras for the GitHub / Firebase version */
  .gmtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  .gmtable th{font:500 12px Oswald;letter-spacing:2px;text-transform:uppercase;color:var(--gold);text-align:left;padding:6px 8px}
  .gmtable td{padding:6px 8px;border-top:1px solid rgba(58,79,192,.35)}
  .gmtable select{background:rgba(3,6,30,.8);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:500 13px Inter}
  .gmtable .x{background:transparent;border:1px solid rgba(255,77,99,.5);color:#ff8b99;border-radius:6px;cursor:pointer;padding:3px 9px}
  .on{display:inline-block;width:9px;height:9px;border-radius:50%;background:#58628f;margin-right:8px}
  .on.y{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row input[type=number]{width:70px;padding:10px;border-radius:8px;border:1px solid var(--line);background:rgba(3,6,30,.8);color:var(--text);font:600 15px Inter}
  .setup{background:rgba(255,77,99,.12);border:1px solid rgba(255,77,99,.5);border-radius:12px;padding:14px;margin-bottom:16px;font-size:14px;line-height:1.5}
  .mates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .mates span{background:rgba(3,6,30,.7);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
  .teamtag{display:inline-flex;align-items:center;gap:10px;font:600 20px Oswald;letter-spacing:2px;text-transform:uppercase;margin-top:12px}
  .teamtag i{width:14px;height:14px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="studio"><div class="stars"></div><div class="beams"></div><div class="floor"></div></div>

<header>
  <div class="logo"><span>Team Quiz</span><b>Champions</b></div>
  <div class="hdr-r">
    <span id="mode" class="badge">Connecting…</span>
  </div>
</header>

<main>
  <section>
    <!-- JOIN -->
    <div id="join" class="panel screen">
      <div id="setupWarn" class="setup hidden"><b>Firebase is not configured yet.</b><br>Open <code>index.html</code> and fill in <code>firebaseConfig</code> at the top of the script.</div>
      <h2>Join the show</h2>
      <label for="pseudo">Your nickname</label>
      <input id="pseudo" type="text" maxlength="16" placeholder="e.g. QuizMaster42" autocomplete="off">
      <p class="muted" style="font-size:14px">Teams are formed automatically when the game starts.</p>
      <div class="err" id="joinErr"></div>
      <button id="startBtn" class="btn">Enter the studio</button>
    </div>

    <!-- LOBBY -->
    <div id="lobby" class="panel screen center hidden">
      <div class="onair">LIVE SHOW</div>
      <h2>Get ready!</h2>
      <div id="lobbyWho" class="muted"></div>
      <div id="lobbyTeam"></div>
      <div id="lobbyMates" class="mates"></div>
      <p id="lobbyTxt" style="font-size:18px;margin:18px 0 0"></p>
      <div style="margin-top:20px"><button id="tStart" class="btn" type="button">Start the game now</button></div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="screen hidden">
      <div class="qtop">
        <div class="pill" id="qcount"></div>
        <div class="timer" id="timer">
          <svg viewBox="0 0 68 68"><circle class="trk" cx="34" cy="34" r="29"/><circle id="ring" class="rng" cx="34" cy="34" r="29"/></svg>
          <span id="timeLeft"></span>
        </div>
        <div class="led" id="myScore">0</div>
      </div>
      <div class="hexb qban"><div class="in"><span id="qText"></span></div></div>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <div style="text-align:center;margin-top:14px"><button id="tNext" class="btn hidden" type="button">Next question ▶</button></div>
    </div>

    <!-- RESULT -->
    <div id="result" class="panel screen center hidden">
      <div class="onair">FINAL RESULTS</div>
      <h2 id="resWho"></h2>
      <div class="bigled" id="resScore"></div>
      <div class="muted" id="resDetail"></div>
      <p id="resTeam" style="font:600 20px Oswald;letter-spacing:1.5px;text-transform:uppercase;margin:18px 0 22px"></p>
      <div style="margin-bottom:14px"><button id="tNew" class="btn" type="button">Play again (new game)</button></div>
      <button id="againBtn" class="btn ghost" type="button">Change nickname</button>
    </div>
  </section>

  <aside class="panel">
    <h3>Top players</h3>
    <ol class="lb" id="lbPlayers"></ol>
  </aside>
</main>

<div class="podiums" id="podiums"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update, remove, serverTimestamp, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== 1) FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDWO_jWztXj1EWWc7ApPlv_0pWyuGqFgf8",
  authDomain: "team-quiz-d4e88.firebaseapp.com",
  databaseURL: "https://team-quiz-d4e88-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "team-quiz-d4e88",
  storageBucket: "team-quiz-d4e88.firebasestorage.app",
  messagingSenderId: "192266201849",
  appId: "1:192266201849:web:fec7bb8c630334af4a1028"
};

/* ===== 2) QUESTIONS — edit freely ===== */
const QUESTIONS = [
  {q:"What is the capital city of Australia?", o:["Sydney","Canberra","Melbourne","Perth"], a:1},
  {q:"Which planet is known as the Red Planet?", o:["Venus","Jupiter","Mars","Mercury"], a:2},
  {q:"Who painted the Mona Lisa?", o:["Michelangelo","Raphael","Vincent van Gogh","Leonardo da Vinci"], a:3},
  {q:"What is the chemical symbol for gold?", o:["Ag","Au","Gd","Go"], a:1},
  {q:"In which year did the Berlin Wall fall?", o:["1985","1987","1989","1991"], a:2},
  {q:"Which is the largest ocean on Earth?", o:["Atlantic","Indian","Arctic","Pacific"], a:3},
  {q:"How many continents are there?", o:["5","6","7","8"], a:2},
  {q:"Which language has the most native speakers worldwide?", o:["English","Mandarin Chinese","Spanish","Hindi"], a:1},
  {q:"What does 'ROI' stand for in business?", o:["Rate of Interest","Return on Investment","Risk of Inflation","Revenue over Income"], a:1},
  {q:"Who wrote the play 'Romeo and Juliet'?", o:["Charles Dickens","Jane Austen","William Shakespeare","Mark Twain"], a:2}
];
/* QUICK TEST: true = the first answer shows the result immediately (right or wrong), for everyone.
   false = normal game: the result appears when time is up or when everyone has answered. */
const QUICK_TEST = true;

const SECONDS = 20;
const TEAM_NAMES = ["Red Falcons","Blue Sharks","Green Wolves","Gold Lions","Purple Owls","Orange Tigers"];
const TEAM_COLORS = {"Red Falcons":"#ff4d63","Blue Sharks":"#4aa8ff","Green Wolves":"#22d37a","Gold Lions":"#ffc83d","Purple Owls":"#c77dff","Orange Tigers":"#ff9f43"};
const RING = 2*Math.PI*29;

/* ---------- STATE ---------- */
const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");
let app, auth, db;
let uid = null;
let players = {}, G = {phase:"idle", gameId:"", q:-1};
let me = null;
let gotGame = false, gotPlayers = false, subscribed = false;
let offset = 0;
let tick = null, lastKey = "", scoredKey = "", earlyT = null;

const $ = id => document.getElementById(id);
const SCREENS = ["join","lobby","quiz","result"];
const show = id => SCREENS.forEach(x => $(x).classList.toggle("hidden", x !== id));
const now = () => Date.now() + offset;
const teamColor = n => TEAM_COLORS[n] || "#8fa0ff";
const setBadge = (t, live) => { $("mode").textContent = t; $("mode").classList.toggle("live", !!live); };
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };

/* ---------- DERIVED DATA ---------- */
function inGame(){
  return Object.entries(players).filter(([id,p]) => p && p.pseudo && (p.gameId || "") === (G.gameId || ""))
    .map(([id,p]) => ({id, ...p}));
}
function teamStandings(){
  const agg = {};
  inGame().forEach(p => {
    if (!p.team) return;
    const a = agg[p.team] || (agg[p.team] = {name:p.team, sum:0, n:0});
    a.sum += p.score || 0; a.n++;
  });
  return Object.values(agg).map(a => ({...a, avg:Math.round(a.sum/a.n)})).sort((a,b) => b.avg - a.avg);
}

/* ---------- BOOT ---------- */
if (!configured){
  setBadge("Not configured", false);
  $("setupWarn").classList.remove("hidden");
  $("startBtn").disabled = true;
  show("join");
}else{
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getDatabase(app);
  setBadge("Connecting…", false);
  onAuthStateChanged(auth, u => {
    if (!u){ signInAnonymously(auth).catch(e => setBadge("Auth error: " + ((e && e.code) || "unknown"), false)); return; }
    uid = u.uid;
    setBadge("Live · connected", true);
    if (!subscribed) subscribe();
    me = players[uid] && players[uid].pseudo ? players[uid] : null;
    route(true);
  });
}

function subscribe(){
  subscribed = true;
  onValue(ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });
  onValue(ref(db, ".info/connected"), s => {
    if (s.val() === true && uid){
      onDisconnect(ref(db, "players/" + uid + "/online")).set(false);
      if (me) update(ref(db, "players/" + uid), {online:true});
    }
  });
  onValue(ref(db, "game"), s => {
    G = Object.assign({phase:"idle", gameId:"", q:-1}, s.val() || {});
    gotGame = true; route();
  });
  onValue(ref(db, "players"), s => {
    const had = !!me;
    players = s.val() || {};
    me = players[uid] && players[uid].pseudo ? players[uid] : null;
    gotPlayers = true;
    renderBoards();
    if (had !== !!me) route(true);
    else if (lastKey.startsWith("lobby")) showLobby();
    maybeEarlyReveal();
  });
}

/* ---------- ROUTER ---------- */
function route(force){
  if (!configured || !uid || !gotGame || !gotPlayers) return;
  if (!me){ if (lastKey !== "join" || force){ lastKey = "join"; clearInterval(tick); show("join"); } return; }
  const key = (G.phase === "question" || G.phase === "reveal" || G.phase === "final")
    ? [G.gameId, G.phase, G.q].join("|") : "lobby|" + G.gameId;
  if (key === lastKey && !force) return;
  lastKey = key; clearInterval(tick);
  if (G.phase === "question") liveQuestion();
  else if (G.phase === "reveal") liveReveal();
  else if (G.phase === "final") showResult();
  else showLobby();
}

/* ---------- JOIN ---------- */
$("startBtn").onclick = async () => {
  const pseudo = $("pseudo").value.trim();
  const err = $("joinErr"); err.textContent = "";
  if (pseudo.length < 2){ err.textContent = "Please enter a nickname (at least 2 characters)."; return; }
  try{
    await update(ref(db, "players/" + uid), {pseudo, gameId:G.gameId || "", score:0, correct:0, answered:0, scoredQ:-1, lastPts:0, ans:null, online:true});
  }catch(e){ err.textContent = "Could not join (database rules?). Check the setup."; }
};
$("againBtn").onclick = async () => {
  try{ await remove(ref(db, "players/" + uid)); }catch(e){}
  me = null; $("pseudo").value = ""; lastKey = ""; route(true);
};

/* ---------- LOBBY ---------- */
function showLobby(){
  if (!me) return;
  show("lobby"); lastKey = "lobby|" + G.gameId;
  $("lobbyWho").textContent = me.pseudo;
  const tt = $("lobbyTeam"); tt.innerHTML = "";
  const mates = $("lobbyMates"); mates.innerHTML = "";
  if (me.team){
    const t = document.createElement("div"); t.className = "teamtag";
    const i = document.createElement("i"); i.style.background = teamColor(me.team); i.style.boxShadow = "0 0 12px " + teamColor(me.team);
    const s = document.createElement("span"); s.textContent = me.team;
    t.append(i, s); tt.appendChild(t);
    inGame().filter(p => p.team === me.team && p.id !== uid).forEach(p => {
      const c = document.createElement("span"); c.textContent = p.pseudo; mates.appendChild(c);
    });
  }
  const n = inGame().filter(p => p.online).length;
  $("lobbyTxt").textContent = "Anyone can start the game. " + n + (n === 1 ? " player" : " players") + " online.";
}

/* ---------- QUESTION UI ---------- */
function buildQuestion(item, idx, onPick){
  show("quiz");
  $("tNext").classList.add("hidden");
  $("qcount").innerHTML = "Question <b>" + (idx+1) + "</b> / " + QUESTIONS.length;
  $("qText").textContent = item.q;
  $("myScore").textContent = me.score || 0;
  $("fb").textContent = ""; $("fb").style.color = "";
  const box = $("opts"); box.innerHTML = "";
  item.o.forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "hexb opt";
    const inner = document.createElement("span"); inner.className = "in";
    const k = document.createElement("b"); k.textContent = "ABCD"[i];
    const t = document.createElement("span"); t.textContent = text;
    inner.append(k, t); b.appendChild(inner);
    b.onclick = () => onPick(i);
    box.appendChild(b);
  });
}
function startedAt(){ return typeof G.startedAt === "number" ? G.startedAt : now(); }
function leftSeconds(){ return Math.max(0, SECONDS - (now() - startedAt())/1000); }
function startTimer(onEnd){
  clearInterval(tick);
  const upd = () => {
    const left = leftSeconds();
    $("timeLeft").textContent = Math.ceil(left);
    $("ring").style.strokeDasharray = RING;
    $("ring").style.strokeDashoffset = RING * (1 - left/SECONDS);
    $("timer").classList.toggle("low", left <= 5);
    if (left <= 0){ clearInterval(tick); onEnd(); }
  };
  tick = setInterval(upd, 200); upd();
}
const setOptsDisabled = v => [...$("opts").children].forEach(b => b.disabled = v);
function setFb(text, color){ $("fb").textContent = text; $("fb").style.color = color || ""; }
function paintReveal(item, chosen){
  [...$("opts").children].forEach((b,k) => {
    b.disabled = true;
    if (k === item.a) b.classList.add("ok");
    else if (k === chosen) b.classList.add("bad");
    else b.classList.add("dim");
  });
}

async function setGame(patch){
  try{ await update(ref(db, "game"), patch); return true; }
  catch(e){ setBadge("Write refused — check the database rules", false); return false; }
}

function liveQuestion(){
  const item = QUESTIONS[G.q]; if (!item){ showLobby(); return; }
  buildQuestion(item, G.q, livePick);
  const done = me.ans && me.ans.q === G.q;
  if (done){
    setOptsDisabled(true);
    const b = $("opts").children[me.ans.choice]; if (b) b.classList.add("sel");
    setFb("Answer locked in!", "var(--gold)");
  }
  startTimer(() => {
    setOptsDisabled(true);
    if (!(me.ans && me.ans.q === G.q)) setFb("Time's up!", "var(--bad)");
    const g = G.gameId, qq = G.q;   // any player's browser can reveal the answer
    setTimeout(() => { if (G.gameId === g && G.phase === "question" && G.q === qq) setGame({phase:"reveal"}); }, 1500 + Math.random()*1500);
  });
}
function livePick(i){
  if (me.ans && me.ans.q === G.q) return;
  const ms = now() - startedAt();
  if (ms > SECONDS*1000 + 800) return;
  const ans = {q:G.q, choice:i, ms:Math.max(0, ms)};
  me.ans = ans; setOptsDisabled(true);
  const b = $("opts").children[i]; if (b) b.classList.add("sel");
  setFb("Answer locked in!", "var(--gold)");
  update(ref(db, "players/" + uid), {ans}).then(() => { if (QUICK_TEST) setGame({phase:"reveal"}); });
}
function liveReveal(){
  const item = QUESTIONS[G.q]; if (!item){ showLobby(); return; }
  buildQuestion(item, G.q, () => {});
  $("ring").style.strokeDasharray = RING; $("ring").style.strokeDashoffset = RING;
  $("timeLeft").textContent = "0"; $("timer").classList.remove("low");
  const a = (me.ans && me.ans.q === G.q) ? me.ans : null;
  paintReveal(item, a ? a.choice : -1);
  $("tNext").textContent = (G.q + 1 >= QUESTIONS.length) ? "Show final results ▶" : "Next question ▶";
  $("tNext").classList.remove("hidden");
  const right = !!(a && a.choice === item.a);
  let pts = me.scoredQ === G.q ? (me.lastPts || 0) : 0;
  const k = G.gameId + "|" + G.q;
  if (me.scoredQ !== G.q && scoredKey !== k){
    scoredKey = k;
    pts = right ? 100 + Math.round(Math.max(0, SECONDS - a.ms/1000)*5) : 0;
    me.score = (me.score || 0) + pts; me.correct = (me.correct || 0) + (right ? 1 : 0);
    update(ref(db, "players/" + uid), {score:me.score, correct:me.correct, scoredQ:G.q, answered:G.q+1, lastPts:pts});
  }
  $("myScore").textContent = me.score || 0;
  if (right) setFb("Correct!" + (pts ? " +" + pts : ""), "var(--ok)");
  else setFb(a ? "Not quite…" : "No answer", "var(--bad)");
}

/* ---------- RESULT ---------- */
function showResult(){
  show("result");
  $("resWho").textContent = me.pseudo + (me.team ? " · " + me.team : "");
  $("resScore").textContent = (me.score || 0) + " PTS";
  $("resDetail").textContent = (me.correct || 0) + " / " + QUESTIONS.length + " correct answers";
  const ts = teamStandings(); const r = ts.findIndex(t => t.name === me.team);
  $("resTeam").textContent = r >= 0 ? "Your team is #" + (r+1) + " of " + ts.length + " (average " + ts[r].avg + " pts)" : "";
}

/* ---------- SCOREBOARD + PODIUMS ---------- */
function renderBoards(){
  const list = inGame().sort((a,b) => (b.score||0) - (a.score||0)).slice(0,10);
  const lp = $("lbPlayers"); lp.innerHTML = "";
  if (!list.length){ const e = document.createElement("div"); e.className = "empty"; e.textContent = "Waiting for players…"; lp.appendChild(e); }
  list.forEach((p,i) => {
    const li = document.createElement("li"); if (p.id === uid) li.className = "me";
    const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = i+1;
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = teamColor(p.team);
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p.pseudo;
    const sm = document.createElement("small"); sm.textContent = p.team || "no team yet"; nm.appendChild(sm);
    const pt = document.createElement("span"); pt.className = "pt"; pt.textContent = p.score || 0;
    li.append(rk, dot, nm, pt); lp.appendChild(li);
  });
  let ts = teamStandings();
  if (!ts.length) ts = TEAM_NAMES.slice(0,4).map(n => ({name:n, avg:0, n:0}));
  const box = $("podiums"); box.innerHTML = "";
  ts.slice(0,6).forEach((t,i) => {
    const w = document.createElement("div"); w.className = "podw" + (i === 0 && t.avg > 0 ? " first" : "");
    w.style.setProperty("--tc", teamColor(t.name));
    const p = document.createElement("div"); p.className = "pod";
    const rk = document.createElement("div"); rk.className = "rank"; rk.textContent = i === 0 && t.avg > 0 ? "★ Leader" : "#" + (i+1);
    const pn = document.createElement("div"); pn.className = "pn"; pn.textContent = t.name;
    const led = document.createElement("div"); led.className = "led"; led.textContent = t.avg;
    const mem = document.createElement("div"); mem.className = "mem"; mem.textContent = "AVG · " + t.n + (t.n === 1 ? " PLAYER" : " PLAYERS");
    p.append(rk, pn, led, mem); w.appendChild(p); box.appendChild(w);
  });
}

/* ---------- GAME CONTROLS (any player) ---------- */
function maybeEarlyReveal(){
  if (G.phase !== "question" || earlyT) return;
  const act = inGame().filter(p => p.online);
  if (act.length && act.every(p => p.ans && p.ans.q === G.q)){
    earlyT = setTimeout(() => { earlyT = null; if (G.phase === "question") setGame({phase:"reveal"}); }, 900);
  }
}
async function placeUnassigned(){
  const act = inGame().filter(p => p.online);
  const free = act.filter(p => !p.team);
  if (!free.length) return;
  const counts = {}; act.forEach(p => { if (p.team) counts[p.team] = (counts[p.team]||0) + 1; });
  let names = Object.keys(counts);
  if (!names.length) names = TEAM_NAMES.slice(0,2);
  names.forEach(n => { if (!(n in counts)) counts[n] = 0; });
  const upd = {};
  shuffle(free).forEach(p => {
    names.sort((a,b) => counts[a] - counts[b]);
    upd["players/" + p.id + "/team"] = names[0]; counts[names[0]]++;
  });
  try{ await update(ref(db), upd); }catch(e){}
}
async function quickStart(){
  const gid = String(Date.now());
  const upd = {"game/gameId":gid, "game/phase":"question", "game/q":0, "game/startedAt":serverTimestamp()};
  const online = shuffle(Object.entries(players).filter(([id,p]) => p && p.pseudo && p.online).map(([id]) => id));
  const n = online.length >= 6 ? 3 : 2;
  Object.keys(players).forEach(id => {
    const b = "players/" + id + "/";
    Object.assign(upd, {[b+"gameId"]:gid, [b+"score"]:0, [b+"correct"]:0, [b+"answered"]:0, [b+"scoredQ"]:-1, [b+"lastPts"]:0, [b+"ans"]:null, [b+"team"]:null});
  });
  online.forEach((id,i) => { upd["players/" + id + "/team"] = TEAM_NAMES[i % n]; });
  try{ await update(ref(db), upd); }catch(e){ setBadge("Write refused — check the database rules", false); }
}
async function quickNext(){
  if (G.phase !== "reveal") return;
  const q = G.q + 1;
  if (q >= QUESTIONS.length){ await setGame({phase:"final"}); return; }
  await placeUnassigned();
  await setGame({phase:"question", q, startedAt:serverTimestamp()});
}
$("tStart").onclick = quickStart;
$("tNew").onclick = quickStart;
$("tNext").onclick = quickNext;

renderBoards();
</script>
